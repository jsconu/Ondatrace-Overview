name: Refresh AI skill downloads
on:
  schedule:
    - cron: '58 23 * * *'
      timezone: America/Denver
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/skill-downloads.yml'
      - 'scripts/update_skill_downloads.py'
permissions:
  contents: write
  pages: write
concurrency:
  group: skill-download-counts
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Count release downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_skill_downloads.py
      - name: Publish the dated snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-skills/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh AI skill download counts'
            git push origin HEAD:master
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
